# ── THRM 官网反代规则（宝塔「伪静态」）──────────────────────────────────────
# 页面        → Vercel（thrm.vercel.app）。改网页后 push 到 GitHub，Vercel 自动部署，这里不用动。
# /api/github → GitHub API（短缓存，避免服务器出口 IP 触发限流）
# /download   → GitHub Release 安装包（服务器跟随 GitHub 的跳转并流式转发，支持断点续传）
# /credits.json → 仓库 main 分支的鸣谢 / 赞助名单（桌面端「关于」页优先从这里读取）
# 全部使用 ^~ 前缀匹配，避开站点配置里宝塔默认的 .js/.css/图片 正则规则。

# 证书续签验证（Let's Encrypt）走本地目录
location ^~ /.well-known/acme-challenge/ {
    allow all;
    try_files $uri =404;
}

# ① Release 接口：只读、只限 TIANLI0/THRM
location ^~ /api/github/ {
    limit_except GET HEAD { deny all; }
    resolver 223.5.5.5 1.1.1.1 ipv6=off valid=300s;
    proxy_pass https://api.github.com/repos/TIANLI0/THRM/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.github.com;
    proxy_set_header User-Agent "thrm-website-proxy";
    proxy_set_header Accept-Encoding "";
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;

    # 未带 token 时 GitHub 每小时只给 60 次；缓存 120 秒，限流或出错时继续用旧数据
    proxy_cache cache_one;
    proxy_cache_key "thrm-api|$request_uri|$http_accept";
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache_valid 200 120s;
    proxy_cache_valid 404 30s;
    proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;

    # 把 JSON 里的 GitHub 下载地址换成本站：桌面端检查更新也可以直接用这个接口
    sub_filter_types application/json;
    sub_filter_once off;
    sub_filter "https://github.com/TIANLI0/THRM/releases/download/" "https://$host/download/";
}

# ② 安装包下载
location ^~ /download/ {
    resolver 223.5.5.5 1.1.1.1 ipv6=off valid=300s;
    proxy_cache off;

    # 最新版：GitHub 302 到具体标签，改写成本站地址后交给浏览器
    location ~ ^/download/latest/([^/]+)$ {
        proxy_pass https://github.com/TIANLI0/THRM/releases/latest/download/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_redirect https://github.com/TIANLI0/THRM/releases/download/ /download/;
    }

    # 指定版本：GitHub 会 302 到带签名的 release-assets 地址，由服务器跟随并转发
    location ~ ^/download/([^/]+)/([^/]+)$ {
        proxy_pass https://github.com/TIANLI0/THRM/releases/download/$1/$2;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 301 302 307 308 = @thrm_github_asset;
    }

    return 404;
}

location @thrm_github_asset {
    resolver 223.5.5.5 1.1.1.1 ipv6=off valid=300s;
    set $thrm_asset_url $upstream_http_location;
    proxy_pass $thrm_asset_url;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_cache off;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# ③ 鸣谢 / 赞助名单：改完 credits.json 推送到 main，最多 60 秒后生效
location = /credits.json {
    resolver 223.5.5.5 1.1.1.1 ipv6=off valid=300s;
    proxy_pass https://raw.githubusercontent.com/TIANLI0/THRM/main/credits.json;
    proxy_ssl_server_name on;
    proxy_set_header Host raw.githubusercontent.com;
    proxy_set_header Cookie "";
    proxy_hide_header Set-Cookie;
    proxy_cache cache_one;
    proxy_cache_key "thrm-credits";
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_cache_valid 200 60s;
    proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503;
    proxy_cache_background_update on;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}

# ④ 其余全部页面 → Vercel
location ^~ / {
    resolver 223.5.5.5 1.1.1.1 ipv6=off valid=300s;
    set $thrm_vercel thrm.vercel.app;
    proxy_pass https://$thrm_vercel;
    proxy_ssl_server_name on;
    proxy_ssl_name thrm.vercel.app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host thrm.vercel.app;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 遵循 Vercel 的缓存头：/_next/static 等带指纹的资源长期缓存在本机，HTML 每次回源保证实时
    proxy_cache cache_one;
    proxy_cache_key "thrm-web|$request_uri";
    add_header X-Cache $upstream_cache_status always;
}
